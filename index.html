<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Grok Imagine Pro - 数据库终极版</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --card: #ffffff;
      --input: #eef1f7;
      --line: #d5dbe6;
      --muted: #667085;
      --text: #1c2434;
      --accent: #4f6ef7;
      --accent-deep: #3d56d4;
      --accent-soft: #e8edff;
      --blue: #3b6fe0;
      --success: #0f9f6e;
      --danger: #d92d20;
      --on-accent: #ffffff;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      --radius: 16px;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      max-width: 100%;
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overflow-x: hidden;
      min-width: 0;
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-wrap: anywhere;
    }

    body.modal-open { overflow: hidden; }

    img, svg, video, canvas {
      max-width: 100%;
      height: auto;
    }

    button, input, select, textarea {
      font: inherit;
      font-size: 16px;
      color: inherit;
      max-width: 100%;
    }

    input, select, textarea {
      min-width: 0;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    header, .tab-bar, .content, .composer, .bottom-bar {
      min-width: 0;
      max-width: 100%;
    }

    header {
      flex-shrink: 0;
      background: var(--surface);
      padding: calc(12px + var(--safe-top)) max(16px, var(--safe-right)) 12px max(16px, var(--safe-left));
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 8px;
      min-width: 0;
      max-width: 100%;
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .tab-bar {
      flex-shrink: 0;
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 0 max(var(--safe-right), 0px) 0 max(var(--safe-left), 0px);
    }

    .tab {
      flex: 1;
      min-width: 0;
      min-height: var(--tap);
      padding: 12px 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .tab-active { border-bottom-color: var(--accent); color: var(--accent); }

    .content {
      flex: 1;
      min-height: 0;
      min-width: 0;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px max(14px, var(--safe-right)) 24px max(14px, var(--safe-left));
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #page1.content {
      padding-bottom: calc(28px + var(--safe-bottom));
    }

    .category-row {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin: -4px 0 14px;
      padding: 4px 0 10px;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      position: sticky;
      top: -14px;
      z-index: 5;
      background: var(--bg);
    }

    .category-row::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--card);
      color: var(--text);
      min-height: var(--tap);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 16px;
      border: 1px solid var(--line);
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .cat-btn.active {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 100%;
    }

    .grid:empty {
      display: flex;
      min-height: 88px;
      margin-bottom: 8px;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 14px;
      padding: 16px;
      text-align: center;
    }

    .grid:empty::before {
      content: "暂无词条，请到「管理/类目」添加";
    }

    .fragment-card {
      background: var(--card);
      min-height: 72px;
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background-size: cover;
      background-position: center;
      border: 2px solid var(--line);
      box-shadow: var(--shadow);
      -webkit-touch-callout: none;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      max-width: 100%;
      min-width: 0;
    }

    .fragment-card:active { transform: scale(0.98); }

    .fragment-card.has-img { height: 120px; min-height: 120px; align-items: flex-end; padding: 0; }

    .fragment-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .fragment-card.selected::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 8px;
      z-index: 3;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .fragment-card .label {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 100%;
      text-align: center;
      font-size: 16px;
      color: var(--text);
      text-shadow: none;
      word-break: break-word;
      overflow-wrap: anywhere;
      padding: 0 4px;
    }

    .has-img .label {
      background: rgba(15, 23, 42, 0.62);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
      padding: 8px 6px;
      backdrop-filter: blur(4px);
    }

    .composer {
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      padding: 8px max(14px, var(--safe-right)) 0 max(14px, var(--safe-left));
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .prompt-box {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 12px 14px;
    }

    textarea#output {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
      min-height: 72px;
      max-height: 28vh;
      resize: none;
      outline: none;
      overflow-y: auto;
    }

    textarea#output::placeholder,
    .input-field::placeholder {
      color: var(--muted);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content {
      background: var(--surface);
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border-radius: 24px 24px 0 0;
      padding: 12px max(16px, var(--safe-right)) calc(20px + var(--safe-bottom)) max(16px, var(--safe-left));
      border: 1px solid var(--line);
      border-bottom: none;
      max-height: min(92dvh, calc(100dvh - var(--safe-top) - 8px));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #c5cbd6;
      margin: 4px auto 14px;
    }

    .modal-content h3 { margin: 0 0 8px; color: var(--accent); font-size: 18px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-actions .action-btn { margin: 0; }

    .bottom-bar {
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 10px max(16px, var(--safe-right)) calc(10px + var(--safe-bottom)) max(16px, var(--safe-left));
      z-index: 100;
    }

    body[data-tab="1"] .bottom-bar,
    body[data-tab="1"] .composer { display: none; }

    .btn-row {
      display: flex;
      gap: 10px;
      min-width: 0;
      max-width: 100%;
    }

    .btn-row button {
      flex: 1;
      min-width: 0;
      border-radius: 999px;
      min-height: 50px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .copy-btn {
      flex: 1 1 auto;
      background: linear-gradient(90deg, var(--accent), var(--accent-deep));
      color: var(--on-accent);
    }

    .reset-btn {
      flex: 0 1 auto;
      min-width: 0;
      white-space: nowrap;
      background: #fff5f4;
      color: var(--danger);
      border: 1px solid #f2c2be;
    }

    .upload-zone, .backup-zone {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      max-width: 100%;
      min-width: 0;
    }

    .upload-zone h4, .backup-zone h4 { margin: 0; font-size: 16px; }

    .section-hint {
      text-align: center;
      margin: 8px 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .input-field {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: var(--tap);
      padding: 12px 14px;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    textarea.input-field {
      min-height: 88px;
      resize: vertical;
      line-height: 1.4;
    }

    select.input-field {
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23667085' d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 12px;
      background: var(--input);
      border-radius: 12px;
      text-align: center;
      margin-top: 10px;
      color: var(--muted);
      border: 1px dashed #b8c0ce;
      cursor: pointer;
      user-select: none;
    }

    .action-btn {
      width: 100%;
      min-height: 48px;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      color: var(--on-accent);
    }

    .btn-accent { background: var(--accent); }
    .btn-info { background: var(--blue); }
    .btn-success { background: var(--success); }
    .btn-secondary {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-danger-outline {
      background: transparent;
      color: var(--danger);
      border: 1px solid #f2c2be;
      font-size: 14px;
      margin-top: 16px;
    }

    #sort-container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 4px 0 16px;
    }

    .sort-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card);
      padding: 6px 8px 6px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      touch-action: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      min-height: var(--tap);
    }

    .sort-name {
      flex: 1;
      min-width: 0;
      min-height: var(--tap);
      display: flex;
      align-items: center;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sort-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .sort-delete, .sort-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--tap);
      min-height: var(--tap);
    }

    .sort-delete { color: var(--danger); }

    .sort-handle { color: var(--muted); font-size: 18px; }

    @media (min-width: 480px) {
      .modal {
        align-items: center;
        padding: max(20px, var(--safe-top)) max(20px, var(--safe-right)) max(20px, var(--safe-bottom)) max(20px, var(--safe-left));
      }

      .modal-content {
        max-width: 400px;
        border-radius: 24px;
        border-bottom: 1px solid var(--line);
        padding: 20px;
        max-height: min(86dvh, calc(100dvh - 40px - var(--safe-top) - var(--safe-bottom)));
      }

      .modal-handle { display: none; }
    }

    @media (max-width: 480px) {
      html, body {
        overflow-x: hidden;
        max-width: 100%;
      }

      .upload-zone, .backup-zone, .prompt-box, .modal-content {
        max-width: 100%;
      }
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .content, .bottom-bar, .composer {
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
      }

      .tab-bar, header { padding-left: max(20px, var(--safe-left)); padding-right: max(20px, var(--safe-right)); }
    }
  </style>
</head>
<body data-tab="0">
  <header>
    <div class="brand">📸 Grok Imagine <span class="brand-sub">数据库终极稳定版</span></div>
  </header>

  <div class="tab-bar">
    <div onclick="switchTab(0)" class="tab tab-active">生成器</div>
    <div onclick="switchTab(1)" class="tab">管理/类目</div>
  </div>

  <div id="page0" class="content">
    <div id="category-row" class="category-row"></div>
    <div id="fragments-grid" class="grid"></div>
  </div>

  <div id="page1" class="content" style="display:none;">
    <div class="upload-zone">
      <h4>📸 新增词条</h4>
      <select id="catSelect" class="input-field"></select>
      <input type="text" id="newName" class="input-field" placeholder="显示名称">
      <textarea id="newValue" class="input-field" placeholder="提示词内容"></textarea>
      <div class="file-input-label" onclick="document.getElementById('imgInput').click()" id="fileLabel">🖼️ 上传图片</div>
      <input type="file" id="imgInput" style="display:none" onchange="previewImage('fileLabel', 'imgInput')" accept="image/*">
      <button onclick="addEntry()" class="action-btn btn-accent">🚀 保存词条</button>
    </div>

    <div class="upload-zone">
      <h4>✨ 类目管理</h4>
      <input type="text" id="newCatName" class="input-field" placeholder="输入新类目名称">
      <button onclick="createNewCategory()" class="action-btn btn-info">➕ 新建类目</button>
    </div>

    <h4 class="section-hint">↕️ 调整顺序 (点击重命名 | 拖拽排序)</h4>
    <div id="sort-container"></div>

    <div class="backup-zone">
      <h4 style="margin:0 0 10px 0;">💾 备份管理</h4>
      <button onclick="exportData()" class="action-btn btn-info">📥 导出数据备份</button>
      <button onclick="document.getElementById('importInput').click()" class="action-btn btn-success">📤 导入数据备份</button>
      <input type="file" id="importInput" style="display:none" onchange="importData(event)" accept=".json">
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-handle" aria-hidden="true"></div>
      <h3>🥚 编辑提示词</h3>
      <input type="text" id="editName" class="input-field">
      <textarea id="editValue" class="input-field" style="height:80px;"></textarea>
      <div class="file-input-label" onclick="document.getElementById('editImgInput').click()" id="editImgLabel">🖼️ 更换图片</div>
      <input type="file" id="editImgInput" style="display:none" onchange="previewImage('editImgLabel', 'editImgInput')" accept="image/*">
      <div class="modal-actions">
        <button onclick="saveEdit()" class="action-btn btn-accent">保存</button>
        <button onclick="closeModal()" class="action-btn btn-secondary">取消</button>
      </div>
      <button onclick="deleteEntry()" class="action-btn btn-danger-outline">🗑️ 删除词条</button>
    </div>
  </div>

  <div class="composer">
    <div class="prompt-box"><textarea id="output" placeholder="点击标签组合..."></textarea></div>
  </div>

  <div class="bottom-bar">
    <div class="btn-row">
      <button type="button" onclick="copyPrompt()" class="copy-btn">📋 复制</button>
      <button type="button" onclick="clearSelected()" class="reset-btn">🗑️ 重置</button>
    </div>
  </div>

  <script>
    const DB_NAME = "GrokImagineDB";
    const STORE_NAME = "AppData";
    let db, fragments = {}, categoryOrder = [], selected = [], currentCategory = "";
    let editingIdx = null;

    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => { 
          db = e.target.result; 
          if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); 
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
      });
    }

    async function saveToDB(key, val) {
      const tx = db.transaction(STORE_NAME, "readwrite");
      await tx.objectStore(STORE_NAME).put(val, key);
    }

    function getFromDB(key) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function initApp() {
      await initDB();
      const saved = await getFromDB("fragments");
      const savedOrder = await getFromDB("categoryOrder");
      fragments = saved || { "人物": [] };
      categoryOrder = savedOrder || Object.keys(fragments);
      currentCategory = categoryOrder[0] || "人物";
      renderAll(); updateCatSelect(); renderSortList();
    }

    async function createNewCategory() {
      const nameInput = document.getElementById('newCatName');
      const name = nameInput.value.trim();
      if(!name) return alert("名称不能为空");
      // 修复检测逻辑
      if(fragments[name]) return alert("类目已存在");
      
      fragments[name] = [];
      categoryOrder.push(name);
      await saveData();
      nameInput.value = "";
      alert("✅ 类目创建成功");
      renderAll(); updateCatSelect(); renderSortList();
    }

    function renderAll() {
      const catRow = document.getElementById('category-row');
      catRow.innerHTML = '';
      categoryOrder.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${cat === currentCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => { currentCategory = cat; renderAll(); };
        catRow.appendChild(btn);
      });

      const grid = document.getElementById('fragments-grid');
      grid.innerHTML = '';
      (fragments[currentCategory] || []).forEach((item, index) => {
        const name = item.name || "未命名";
        const value = item.value || "";
        const card = document.createElement('div');
        card.className = `fragment-card ${selected.includes(value) ? 'selected' : ''} ${item.img ? 'has-img' : ''}`;
        if(item.img) card.style.backgroundImage = `url(${item.img})`;
        card.innerHTML = `<div class="label">${name}</div>`;
        
        let timer;
        card.onclick = () => {
          const idx = selected.indexOf(value);
          if(idx > -1) selected.splice(idx,1); else selected.push(value);
          renderAll(); updateOutput();
        };
        card.ontouchstart = () => timer = setTimeout(() => openEditModal(index), 800);
        card.ontouchend = () => clearTimeout(timer);
        grid.appendChild(card);
      });
    }

    function openEditModal(index) {
      editingIdx = index;
      const item = fragments[currentCategory][index];
      document.getElementById('editName').value = item.name || "";
      document.getElementById('editValue').value = item.value || "";
      document.getElementById('editImgLabel').innerText = item.img ? "🖼️ 更换图片" : "🖼️ 上传图片";
      document.getElementById('editModal').style.display = 'flex';
      document.body.classList.add('modal-open');
    }

    async function saveEdit() {
      const item = fragments[currentCategory][editingIdx];
      item.name = document.getElementById('editName').value.trim();
      item.value = document.getElementById('editValue').value.trim();
      const file = document.getElementById('editImgInput').files[0];
      if(file) {
        item.img = await new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = e => r(e.target.result); });
      }
      await saveData(); closeModal(); renderAll();
    }

    async function deleteEntry() {
      if(confirm("确定删除？")) {
        fragments[currentCategory].splice(editingIdx, 1);
        await saveData(); closeModal(); renderAll();
      }
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
      document.body.classList.remove('modal-open');
      editingIdx = null;
    }

    function renderSortList() {
      const container = document.getElementById('sort-container');
      container.innerHTML = '';
      categoryOrder.forEach((cat, index) => {
        const item = document.createElement('div');
        item.className = 'sort-item';
        item.innerHTML = `<span class="sort-name" onclick="renameCategory('${cat}')">${cat}</span><div class="sort-actions"><span class="sort-delete" onclick="deleteCategory('${cat}')">🗑️</span><div class="sort-handle" aria-hidden="true">☰</div></div>`;
        item.dataset.index = index;
        item.ontouchstart = handleSortStart;
        item.ontouchmove = handleSortMove;
        item.ontouchend = handleSortEnd;
        container.appendChild(item);
      });
    }

    function renameCategory(oldName) {
      const newName = prompt("重命名:", oldName);
      if(!newName || fragments[newName]) return;
      fragments[newName] = fragments[oldName]; delete fragments[oldName];
      categoryOrder[categoryOrder.indexOf(oldName)] = newName;
      if(currentCategory === oldName) currentCategory = newName;
      saveData(); renderAll(); updateCatSelect(); renderSortList();
    }

    function deleteCategory(cat) {
      if(confirm(`删除「${cat}」？`)) {
        delete fragments[cat];
        categoryOrder = categoryOrder.filter(c => c !== cat);
        currentCategory = categoryOrder[0] || "人物";
        saveData(); renderAll(); updateCatSelect(); renderSortList();
      }
    }

    let dragSrcIndex = null;
    function handleSortStart(e) { if(e.target.tagName === 'SPAN') return; dragSrcIndex = this.dataset.index; this.style.opacity = '0.5'; }
    function handleSortMove(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const item = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.sort-item');
      if (item && item.dataset.index !== dragSrcIndex) {
        const targetIndex = item.dataset.index;
        const temp = categoryOrder[dragSrcIndex];
        categoryOrder.splice(dragSrcIndex, 1); categoryOrder.splice(targetIndex, 0, temp);
        dragSrcIndex = targetIndex; renderSortList();
      }
    }
    function handleSortEnd() { this.style.opacity = '1'; saveData(); renderAll(); }

    function previewImage(labelId, inputId) {
      const file = document.getElementById(inputId).files[0];
      if(file) document.getElementById(labelId).innerText = `✅ 图片就绪`;
    }

    async function addEntry() {
      const name = document.getElementById('newName').value.trim();
      const val = document.getElementById('newValue').value.trim();
      const file = document.getElementById('imgInput').files[0];
      const cat = document.getElementById('catSelect').value;
      if(!name || !val) return alert("名称和提示词必填");
      let base64 = "";
      if(file) base64 = await new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = e => r(e.target.result); });
      fragments[cat].push({ name, value: val, img: base64 });
      await saveData(); renderAll();
      document.getElementById('newName').value = ""; document.getElementById('newValue').value = "";
      document.getElementById('fileLabel').innerText = "🖼️ 上传图片";
    }

    async function saveData() { await saveToDB("fragments", fragments); await saveToDB("categoryOrder", categoryOrder); }

    function exportData() {
      const dataString = JSON.stringify(fragments);
      const blob = new Blob([dataString], {type: "application/json"});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `bak_${Date.now()}.json`;
      a.click();
    }

    async function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          fragments = JSON.parse(ev.target.result);
          categoryOrder = Object.keys(fragments);
          await saveData();
          location.reload();
        } catch(err) { alert("文件无效或格式错误"); }
      };
      reader.readAsText(file);
    }

    function updateOutput() { document.getElementById('output').value = selected.join(', '); }
    function updateCatSelect() {
      const select = document.getElementById('catSelect'); select.innerHTML = '';
      categoryOrder.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = c; select.appendChild(opt); });
    }
    function switchTab(n) {
      document.getElementById('page0').style.display = n===0 ? 'block' : 'none';
      document.getElementById('page1').style.display = n===1 ? 'block' : 'none';
      document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('tab-active',i===n));
      document.body.dataset.tab = String(n);
    }
    function copyPrompt() { const txt = document.getElementById('output'); txt.select(); navigator.clipboard.writeText(txt.value).then(()=>alert('✅ 已复制')); }
    function clearSelected() { selected = []; renderAll(); updateOutput(); }
    window.onload = initApp;
  </script>
</body>
</html>
